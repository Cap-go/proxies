name: Deploy Workers

on:
  push:
    branches:
      - main
    paths:
      - 'affonso/**'
      - 'datafast/**'
      - 'posthog/**'
      - 'plausible/**'
  workflow_dispatch:
    inputs:
      folder:
        description: 'Worker folder to deploy (all deploys every folder)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - affonso
          - datafast
          - posthog
          - plausible

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      folders: ${{ steps.detect.outputs.folders }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed Worker folders
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLDER: ${{ inputs.folder }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          all="affonso datafast posthog plausible"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_FOLDER" ] || [ "$INPUT_FOLDER" = "all" ]; then
              folders="$all"
            else
              folders="$INPUT_FOLDER"
            fi
          elif [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # First push or unknown base: deploy everything (wrangler deploy is idempotent).
            folders="$all"
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            folders=""
            for d in $all; do
              if printf '%s\n' "$changed" | grep -q "^${d}/"; then
                folders="$folders $d"
              fi
            done
          fi
          json="$(printf '%s\n' $folders | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "Folders to deploy: $json"
          echo "folders=$json" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.folders != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}
    concurrency:
      group: deploy-${{ matrix.folder }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same as ./deploy.sh <folder>, with wrangler pinned to match package.json (^3).
      - name: Deploy ${{ matrix.folder }}
        working-directory: ${{ matrix.folder }}
        run: npx --yes wrangler@3.114.17 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
